# Met le site en ligne sur GitHub Pages à chaque enregistrement (push) sur main.
# Tant que Pages n'est pas activé (Settings → Pages → Source : « GitHub Actions »),
# ce workflow s'arrête proprement, SANS échec, et explique quoi faire.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      pret: ${{ steps.pages.outputs.pret }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            {
              echo "## Ton site n'est pas encore en ligne : c'est normal"
              echo ""
              echo "Active GitHub Pages **une seule fois** :"
              echo ""
              echo "1. Onglet **Settings** du dépôt"
              echo "2. Colonne de gauche : **Pages**"
              echo "3. Menu **Source** : choisis **GitHub Actions**"
              echo ""
              echo "Si le dépôt est **privé**, Pages gratuit ne fonctionne pas : passe-le en **Public** (Settings → General → Danger Zone → Change visibility)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Site pas encore en ligne::Active Pages : Settings → Pages → Source : GitHub Actions"
          fi

  deploy:
    needs: verifier
    if: needs.verifier.outputs.pret == 'oui'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
